  - 8-12 years
  - 2 to 4 years
  - 3 to 5 years
  - 5 to 8 years
  - 10+ years
  - 15+ years

# 4) Location: "" = anywhere. Your rule: anywhere in India (open to remote too).
location: "India"

# 5) Remote only? false = India ON-SITE ONLY (remote jobs are REJECTED).
remote: false

# 6) Level: junior / mid / senior  (or "" = any). Fresher-friendly.
seniority: ""

# 7) Minimum salary (or null = any)
salary_floor: null

