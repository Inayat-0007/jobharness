# 3) REJECT list — FRESHER ONLY (0-1 yr). Any senior/mid-level or experience
#    signal of 2+ years (or ranges starting at 2+) is skipped. "1+ year" is
#    kept: it is the standard entry-level label at Microsoft/Amazon/Google.
