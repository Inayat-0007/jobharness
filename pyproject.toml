[project]
name = "jobharness"
version = "0.1.0"
description = "On-demand job harvest harness: pull fresh job postings across channels, validate, dedupe, deliver via HTML/CSV + Telegram."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "feedparser>=6.0",
    "playwright>=1.40",
    "playwright-stealth>=2.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
telegram = ["python-telegram-bot>=21.0"]  # legacy: delivery now uses httpx directly
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]
ml = ["scikit-learn>=1.4", "numpy>=1.26"]

[project.scripts]
jobharness = "jobharness.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobharness*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "browser: tests requiring a real browser (excluded from CI)",
    "ml: tests requiring the ml extra (scikit-learn)",
    "integration: tests requiring live network access",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line length handled by formatter; warn-only
    "B008",  # function calls in default args (deliberate in dataclasses)
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false
exclude = ["tests/fixtures"]
